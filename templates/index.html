<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUP — Sistema de Apoio Clínico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #141516;
    --bg-surface:  #1e2022;
    --bg-hover:    #272a2d;
    --bg-input:    #1e2022;
    --bg-msg-user: #1e2022;
    --bg-code:     #12141a;

    --border:      rgba(255,255,255,0.07);
    --border-input: rgba(255,255,255,0.12);

    --text:        #e8eaed;
    --text-sub:    #9aa0a6;
    --text-muted:  #5f6368;

    --accent:      #4db8ff;
    --accent-dim:  rgba(77,184,255,0.12);
    --accent-glow: rgba(77,184,255,0.20);

    --radius-sm:   8px;
    --radius-md:   14px;
    --radius-lg:   22px;
    --radius-pill: 9999px;

    --sidebar-w:   260px;
    --header-h:    60px;

    --font: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* ── LAYOUT ── */
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: #0f1012;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.28s var(--ease-out), min-width 0.28s var(--ease-out), width 0.28s var(--ease-out);
    overflow: hidden;
    z-index: 10;
  }

  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    border-right: none;
  }

  .sidebar-top {
    padding: 14px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-new-chat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }

  .btn-new-chat:hover {
    background: var(--bg-hover);
    border-color: rgba(255,255,255,0.15);
  }

  .btn-new-chat svg { flex-shrink: 0; color: var(--accent); }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }

  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { color: var(--text-muted); flex-shrink: 0; }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    width: 100%;
  }

  .search-box input::placeholder { color: var(--text-muted); }

  .sidebar-section-label {
    padding: 14px 14px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }

  .chat-history::-webkit-scrollbar { width: 4px; }
  .chat-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.12s ease;
    white-space: nowrap;
    overflow: hidden;
  }

  .history-item:hover { background: rgba(255,255,255,0.06); }
  .history-item.active { background: var(--accent-dim); }

  .history-item svg { flex-shrink: 0; color: var(--text-muted); }

  .history-item span {
    font-size: 13.5px;
    color: var(--text-sub);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item.active span { color: var(--text); }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .btn-settings {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: var(--text-sub);
    font-family: var(--font);
    font-size: 13.5px;
    cursor: pointer;
    width: 100%;
    transition: background 0.12s ease, color 0.12s ease;
    white-space: nowrap;
  }

  .btn-settings:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ── HEADER ── */
  .header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn-toggle {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
    flex-shrink: 0;
  }

  .btn-toggle:hover { background: var(--bg-hover); color: var(--text); }

  .logo {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--accent);
    user-select: none;
  }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    padding: 0 0 24px;
  }

  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  /* ── WELCOME ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - var(--header-h) - 120px);
    padding: 40px 24px;
    gap: 40px;
    animation: fadeUp 0.4s var(--ease-out) both;
  }

  .welcome-title {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 50%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }

  .suggestions-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 300px));
    gap: 12px;
    width: 100%;
    max-width: 640px;
  }

  .suggestion-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.18s var(--ease-spring);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .suggestion-card:hover {
    background: var(--bg-hover);
    border-color: rgba(77,184,255,0.25);
    transform: translateY(-2px);
  }

  .suggestion-icon {
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .suggestion-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .suggestion-sub {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ── MESSAGES ── */
  .messages {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 24px 0;
    width: 100%;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px 0;
  }

  .message-user {
    align-items: flex-end;
    animation: slideRight 0.18s var(--ease-out) both;
  }

  .message-ai {
    align-items: flex-start;
    animation: fadeUp 0.22s var(--ease-out) both;
  }

  .message-bubble {
    padding: 12px 18px;
    border-radius: var(--radius-lg);
    max-width: 72%;
    font-size: 14.5px;
    line-height: 1.65;
  }

  .message-user .message-bubble {
    background: var(--bg-msg-user);
    border: 1px solid var(--border);
    border-bottom-right-radius: 6px;
    color: var(--text);
  }

  .message-ai .message-bubble {
    background: transparent;
    padding: 4px 0;
    max-width: 100%;
    color: var(--text);
  }

  .ai-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .ai-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .ai-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.01em;
  }

  .message-ai .message-bubble p { margin-bottom: 10px; }
  .message-ai .message-bubble p:last-child { margin-bottom: 0; }

  .message-ai .message-bubble strong { color: var(--text); font-weight: 600; }

  .message-ai .message-bubble ul,
  .message-ai .message-bubble ol {
    padding-left: 20px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .message-ai .message-bubble li { font-size: 14.5px; }

  .message-ai .message-bubble code {
    font-family: var(--font-mono);
    font-size: 13px;
    background: rgba(77,184,255,0.10);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .code-block {
    margin: 12px 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid var(--border);
  }

  .code-lang {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .btn-copy-code {
    font-size: 11.5px;
    color: var(--text-sub);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    padding: 2px 8px;
    border-radius: 4px;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .btn-copy-code:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  .code-block pre {
    padding: 14px 16px;
    background: var(--bg-code);
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.7;
    color: #cdd6f4;
  }

  .msg-actions {
    display: flex;
    gap: 2px;
    padding: 4px 0 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .message-ai:hover .msg-actions { opacity: 1; }

  .btn-action {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .btn-action:hover { background: var(--bg-hover); color: var(--text); }

  /* ── LOADING DOTS ── */
  .thinking {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 16px 0 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.35; }
    40%           { transform: scale(1);   opacity: 1; }
  }

  /* Cursor piscando no streaming */
  .streaming-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.75s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── INPUT AREA ── */
  .input-area {
    padding: 12px 24px 10px;
    flex-shrink: 0;
    max-width: 780px;
    margin: 0 auto;
    width: 100%;
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-lg);
    padding: 10px 12px 10px 18px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.6;
    resize: none;
    max-height: 140px;
    overflow-y: auto;
    padding: 2px 0;
  }

  .chat-input::placeholder { color: var(--text-muted); }

  .chat-input::-webkit-scrollbar { width: 3px; }
  .chat-input::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .btn-send {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #0a0e14;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.15s var(--ease-spring), opacity 0.15s ease;
  }

  .btn-send:not(:disabled):hover {
    background: #7dceff;
    transform: scale(1.08);
  }

  .btn-send:disabled {
    background: rgba(255,255,255,0.08);
    color: var(--text-muted);
    cursor: default;
    transform: none;
  }

  .input-footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 8px;
    padding: 0 4px;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideRight {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      transform: translateX(0);
      z-index: 100;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
    }

    .overlay {
      display: block;
    }

    .suggestions-grid {
      grid-template-columns: 1fr;
    }
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 90;
  }

  .overlay.visible { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── TOKEN MODAL ── */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 11, 12, 0.92);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s var(--ease-out);
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .token-modal {
    width: 90%;
    max-width: 420px;
    background: #1e2022;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.5s var(--ease-spring), opacity 0.5s ease;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    opacity: 0;
  }

  .modal-overlay.active .token-modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .token-header {
    text-align: center;
  }

  .token-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, rgba(77,184,255,0.2), rgba(167,139,250,0.2));
    color: var(--accent);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .token-icon svg { width: 34px; height: 34px; }

  .token-title {
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.02em;
  }

  .token-desc {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .token-input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .token-input-group label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .token-input {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px 20px;
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    outline: none;
    transition: all 0.25s ease;
    text-align: center;
    letter-spacing: 0.2em;
  }

  .token-input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 0 4px rgba(77,184,255,0.15);
  }

  .btn-auth {
    background: var(--accent);
    color: #08090a;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }

  .btn-auth:hover {
    background: #7dceff;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(77,184,255,0.2);
  }

  .btn-auth:active {
    transform: translateY(0) scale(0.98);
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
    <div class="sidebar-top">
      <button class="btn-new-chat" id="btnNewChat" aria-label="Nova conversa">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nova conversa
      </button>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Buscar conversas..." aria-label="Buscar no histórico">
      </div>
    </div>

    <div class="sidebar-section-label">Recentes</div>

    <nav class="chat-history" id="chatHistory" role="navigation" aria-label="Histórico de conversas">
      <!-- Chat history items will be rendered here -->
    </nav>

    <div class="sidebar-footer">
      <button class="btn-settings" id="btnClearChat" aria-label="Limpar conversas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Limpar conversas
      </button>
    </div>
  </aside>

  <!-- OVERLAY mobile -->
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <!-- MAIN -->
  <main class="main">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="btn-toggle" id="btnToggle" aria-label="Alternar menu lateral" aria-expanded="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="logo">SUP</span>
      </div>
      <a href="/admin" class="btn-settings" style="width: auto; padding: 6px 12px; font-size: 12px; border: 1px solid var(--border);">Administração</a>
    </header>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Área de mensagens">
      <!-- Welcome state -->
      <div class="welcome" id="welcome">
        <h1 class="welcome-title">Olá, como posso ajudar?</h1>
        <div class="suggestions-grid" id="suggestionsGrid">
          <button class="suggestion-card" aria-label="Sepse — Manejo inicial e protocolos">
            <div class="suggestion-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
              </svg>
            </div>
            <div class="suggestion-title">Sepse</div>
            <div class="suggestion-sub">Manejo inicial e protocolos.</div>
          </button>
          <button class="suggestion-card" aria-label="Síndrome metabólica — Critérios e tratamento">
            <div class="suggestion-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
              </svg>
            </div>
            <div class="suggestion-title">Síndrome metabólica</div>
            <div class="suggestion-sub">Critérios e tratamento.</div>
          </button>
          <button class="suggestion-card" aria-label="Hipertensão — Opções farmacológicas">
            <div class="suggestion-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </div>
            <div class="suggestion-title">Hipertensão</div>
            <div class="suggestion-sub">Opções farmacológicas.</div>
          </button>
          <button class="suggestion-card" aria-label="Dor torácica — Investigação baixo risco">
            <div class="suggestion-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
            <div class="suggestion-title">Dor torácica</div>
            <div class="suggestion-sub">Investigação baixo risco.</div>
          </button>
        </div>
      </div>

      <!-- Messages container (hidden initially) -->
      <div class="messages" id="messages" style="display:none;"></div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Digite sua consulta clínica..."
          rows="1"
          aria-label="Campo de mensagem"
          aria-multiline="true"
        ></textarea>
        <button class="btn-send" id="btnSend" disabled aria-label="Enviar mensagem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <p class="input-footer">Respostas geradas por IA. Verifique informações importantes.</p>
    </div>
  </main>
</div>

<div id="token-overlay" class="modal-overlay">
  <div class="token-modal">
    <div class="token-header">
      <div class="token-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h2 class="token-title">Acesso Restrito</h2>
      <p class="token-desc">Este sistema é exclusivo para profissionais de saúde habilitados. Insira seu token de acesso para continuar.</p>
    </div>
    
    <div class="token-input-group">
      <label for="modal-token-input">Token de Acesso</label>
      <input type="password" id="modal-token-input" class="token-input" placeholder="••••••••" autocomplete="off">
    </div>
    
    <button id="btn-entrar" class="btn-auth">Entrar no Sistema</button>
  </div>
</div>

<script>
  // ── STATE ──
  const state = {
    sidebarOpen: true,
    conversations: {},
    currentConversation: null
  };

  // ── ELEMENTS ──
  const sidebar      = document.getElementById('sidebar');
  const overlay      = document.getElementById('overlay');
  const btnToggle    = document.getElementById('btnToggle');
  const btnNewChat   = document.getElementById('btnNewChat');
  const chatArea     = document.getElementById('chatArea');
  const welcome      = document.getElementById('welcome');
  const messages     = document.getElementById('messages');
  const chatInput    = document.getElementById('chatInput');
  const btnSend      = document.getElementById('btnSend');
  const tokenOverlay = document.getElementById('token-overlay');
  const tokenInput   = document.getElementById('modal-token-input');
  const btnEntrar    = document.getElementById('btn-entrar');
  const btnClearChat = document.getElementById('btnClearChat');
  const chatHistory  = document.getElementById('chatHistory');

  // ── NOVA CONVERSA ──
  function startNewChat() {
    const id = Date.now();
    state.conversations[id] = [];
    state.currentConversation = id;
    renderMessages([]);
    chatInput.focus();
    // Fechar sidebar no mobile se necessário
    if (window.innerWidth <= 768) toggleSidebar();
  }
  btnNewChat.addEventListener('click', startNewChat);

  // ── LIMPAR CONVERSAS ──
  function clearChats() {
    if(confirm('Tem certeza que deseja limpar todo o histórico?')) {
      state.conversations = {};
      startNewChat();
      chatHistory.innerHTML = '';
    }
  }
  btnClearChat.addEventListener('click', clearChats);

  // ── SIDEBAR TOGGLE ──
  function toggleSidebar() {
    state.sidebarOpen = !state.sidebarOpen;
    sidebar.classList.toggle('collapsed', !state.sidebarOpen);
    overlay.classList.toggle('visible', state.sidebarOpen && window.innerWidth <= 768);
    btnToggle.setAttribute('aria-expanded', state.sidebarOpen);
  }

  btnToggle.addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', toggleSidebar);

  // ── RENDER MESSAGES ──
  function renderMessages(msgs) {
    if (!msgs || msgs.length === 0) {
      welcome.style.display = 'flex';
      messages.style.display = 'none';
      return;
    }
    welcome.style.display = 'none';
    messages.style.display = 'flex';
    messages.innerHTML = '';

    msgs.forEach(msg => {
      const el = buildMessage(msg.role, msg.text);
      messages.appendChild(el);
    });

    scrollToBottom();
  }

  function buildMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `message message-${role}`;

    if (role === 'user') {
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);
    } else {
      const aiHead = document.createElement('div');
      aiHead.className = 'ai-header';
      aiHead.innerHTML = `
        <div class="ai-icon" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="white">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <span class="ai-name">SUP</span>
      `;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = parseMarkdown(text);
      
      wrap.appendChild(aiHead);
      wrap.appendChild(bubble);
    }

    return wrap;
  }

  // ── MARKDOWN PARSER ──
  function parseMarkdown(text) {
    return text
      .replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${escapeHtml(code)}</code></pre>`)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .split('\n\n').map(p => p.startsWith('<') ? p : `<p>${p}</p>`).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── API INTEGRATION ──
  async function sendMessage(text) {
    const token = sessionStorage.getItem('sup_token');
    if (!token) { alert('Token não encontrado. Faça login.'); return; }

    welcome.style.display = 'none';
    messages.style.display = 'flex';

    const conv = state.conversations[state.currentConversation];
    conv.push({ role: 'user', text });

    messages.appendChild(buildMessage('user', text));
    scrollToBottom();

    const thinkEl = document.createElement('div');
    thinkEl.className = 'message message-ai';
    thinkEl.innerHTML = `
      <div class="ai-header"><span class="ai-name">SUP</span></div>
      <div class="thinking"><span>Processando...</span></div>
    `;
    messages.appendChild(thinkEl);
    scrollToBottom();

    const params = new URLSearchParams({ pergunta: text, token });
    const es = new EventSource(`/consultar/stream?${params}`);

    let fullResponse = "";
    es.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.tipo === 'resposta') {
        fullResponse = data.resposta;
        const aiEl = buildMessage('ai', fullResponse);
        messages.replaceChild(aiEl, thinkEl);
        conv.push({ role: 'ai', text: fullResponse });
        scrollToBottom();
      } else if (data.tipo === 'fim') {
        es.close();
      }
    };
    es.onerror = () => { thinkEl.remove(); es.close(); };
  }

  function scrollToBottom() {
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
  }

  // ── INPUT BEHAVIOR ──
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
    btnSend.disabled = !chatInput.value.trim();
  });

  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!btnSend.disabled) handleSend();
    }
  });

  btnSend.addEventListener('click', handleSend);

  function handleSend() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    chatInput.style.height = 'auto';
    btnSend.disabled = true;
    sendMessage(text);
  }

  // ── INIT ──
  function checkAuth() {
    if (!sessionStorage.getItem('sup_token')) {
      tokenOverlay.classList.add('active');
      setTimeout(() => tokenInput.focus(), 600);
    }
  }

  function handleAuth() {
    const token = tokenInput.value.trim();
    if (token) {
      sessionStorage.setItem('sup_token', token);
      tokenOverlay.classList.remove('active');
      setTimeout(() => chatInput.focus(), 400);
    }
  }

  btnEntrar.addEventListener('click', handleAuth);
  tokenInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAuth();
  });

  checkAuth();
  
  // Initialize with a default conversation
  const defaultId = Date.now();
  state.conversations[defaultId] = [];
  state.currentConversation = defaultId;
  chatInput.focus();

</script>
</body>
</html>
